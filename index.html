<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SwiftNote</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    
    <style>
        :root { --app-height: 100vh; }
        @supports (-webkit-touch-callout: none) {
            :root { --app-height: -webkit-fill-available; }
        }
        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #000000; }
        }
        
        .editor-style {
            font-size: 18px;
            line-height: 1.6;
            padding: 1.25rem; /* p-5 equivalent */
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
        }

        #editor {
            color: transparent;
            caret-color: #1c1c1e;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media (prefers-color-scheme: dark) {
            #editor { caret-color: #f2f2f7; }
        }
        #editor::-webkit-scrollbar { display: none; }
        
        /* Subtle animation for status bar text */
        .status-pulse {
            animation: pulse-green 0.3s ease-in-out;
        }
        @keyframes pulse-green {
            0% { color: inherit; }
            50% { color: #34c759; }
            100% { color: inherit; }
        }
    </style>
</head>
<body>

    <div class="flex flex-col w-full bg-white dark:bg-black text-[#1c1c1e] dark:text-[#f2f2f7] font-sans overflow-hidden"
         style="height: var(--app-height); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);">
        
        <div class="relative flex-1 w-full overflow-hidden flex flex-col">
            <div id="highlighter" class="absolute inset-0 editor-style pointer-events-none z-10 overflow-hidden" aria-hidden="true"></div>
            <textarea id="editor" class="absolute inset-0 w-full h-full bg-transparent border-none outline-none resize-none editor-style z-20"
                      style="-webkit-tap-highlight-color: transparent;" autofocus spellcheck="false"></textarea>
        </div>

        <div id="bottomBar" class="h-[44px] min-h-[44px] bg-[#f8f8f8] dark:bg-[#1c1c1e] border-t border-[#e5e5ea] dark:border-[#38383a] flex justify-between items-center px-5 select-none touch-pan-y">
            <div class="flex items-center gap-2 text-[13px] font-medium text-gray-500 dark:text-gray-400 pointer-events-none">
                <div id="statusDot" class="w-2 h-2 rounded-full transition-colors duration-300 bg-yellow-400"></div>
                <span id="statusText">Local Cache</span>
            </div>
            <button id="clearBtn" class="text-[#007aff] text-[15px] font-semibold bg-transparent border-none p-0 cursor-pointer active:opacity-70"
                    style="-webkit-tap-highlight-color: transparent;">
                Clear
            </button>
        </div>

        <div id="clearModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div class="bg-white dark:bg-[#1c1c1e] w-[270px] rounded-[14px] flex flex-col overflow-hidden duration-200">
                <div class="p-5 text-center flex flex-col gap-1 border-b border-gray-200 dark:border-gray-800">
                    <h3 class="font-semibold text-[17px] m-0">Clear Note?</h3>
                    <p class="text-[13px] m-0 text-gray-500 dark:text-gray-400">This action cannot be undone.</p>
                </div>
                <div class="flex">
                    <button id="cancelBtn" class="flex-1 p-[11px] text-[17px] text-[#007aff] border-r border-gray-200 dark:border-gray-800 bg-transparent active:bg-gray-100 dark:active:bg-gray-800 transition-colors">
                        Cancel
                    </button>
                    <button id="confirmClearBtn" class="flex-1 p-[11px] text-[17px] font-semibold text-[#ff3b30] bg-transparent active:bg-gray-100 dark:active:bg-gray-800 transition-colors">
                        Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyDoeWb3w1vJs6hoexIetSiAqQU1wXhX1tM",
                authDomain: "trainx-49d0e.firebaseapp.com",
                projectId: "trainx-49d0e",
                storageBucket: "trainx-49d0e.firebasestorage.app",
                messagingSenderId: "905714923468",
                appId: "1:905714923468:web:5218d3c8b379dae8238f69"
            };
        } catch (e) {
            console.error("Config parse error", e);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : firebaseConfig.appId;

        const editor = document.getElementById('editor');
        const highlighter = document.getElementById('highlighter');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const bottomBar = document.getElementById('bottomBar');
        const clearBtn = document.getElementById('clearBtn');
        const clearModal = document.getElementById('clearModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmClearBtn = document.getElementById('confirmClearBtn');

        let currentUser = null;
        let saveTimeout = null;
        let isRemoteUpdate = false;
        const localCacheKey = 'swiftnote_vanilla_cache';

        const setStatus = (text, type) => {
            statusText.innerText = text;
            statusDot.className = 'w-2 h-2 rounded-full transition-colors duration-300';
            if (type === 'saved') statusDot.classList.add('bg-green-500');
            else if (type === 'saving') statusDot.classList.add('bg-blue-500');
            else if (type === 'error') statusDot.classList.add('bg-red-500');
            else statusDot.classList.add('bg-yellow-400');
        };

        // --- Highlighting Engine ---
        const renderHighlighter = () => {
            let val = editor.value;
            if (!val) {
                highlighter.innerHTML = '<span class="text-gray-400 dark:text-gray-600">Start typing...\n• lists\n☐ tasks\n-- time\n1 + 1 = math</span>';
                return;
            }
            // Escape HTML safely
            val = val.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const lines = val.split('\n');
            const formattedLines = lines.map(line => {
                if (line.match(/^(\s*)☑/)) {
                    // Gray out and strikethrough ticked items
                    return `<span class="text-gray-400 dark:text-gray-500 line-through">${line}</span>`;
                }
                return `<span class="text-[#1c1c1e] dark:text-[#f2f2f7]">${line}</span>`;
            });
            let html = formattedLines.join('\n');
            if (val.endsWith('\n')) html += '<br>'; // Allow scrolling past final newline
            highlighter.innerHTML = html;
        };

        // Keep scroll positions perfectly synced
        editor.addEventListener('scroll', () => { highlighter.scrollTop = editor.scrollTop; });

        const cached = localStorage.getItem(localCacheKey);
        if (cached) {
            editor.value = cached;
            renderHighlighter();
        }

        setTimeout(() => {
            editor.focus();
            editor.setSelectionRange(editor.value.length, editor.value.length);
        }, 100);

        const initAuth = async () => {
            try {
                setStatus('Connecting...', 'saving');
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                setStatus('Offline Mode', 'local');
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) setupCloudSync(user);
            else setStatus('Auth Error', 'error');
        });

        let unsubscribeSnapshot = null;
        const setupCloudSync = (user) => {
            const noteDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'notes', 'scratchpad');

            const cachedText = localStorage.getItem(localCacheKey);
            if (cachedText) {
                setDoc(noteDocRef, { content: cachedText, updatedAt: Date.now() }, { merge: true })
                    .then(() => setStatus('Synced', 'saved'))
                    .catch(() => setStatus('Sync Error', 'error'));
            } else {
                setStatus('Synced', 'saved');
            }

            if (unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(noteDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (editor.value !== cloudData.content && document.activeElement !== editor) {
                        isRemoteUpdate = true;
                        editor.value = cloudData.content || '';
                        renderHighlighter();
                        localStorage.setItem(localCacheKey, editor.value);
                        setTimeout(() => { isRemoteUpdate = false; }, 50);
                    }
                }
            });
        };

        // --- Feature 1, 2, 3, 4: Magic Input formatting ---
        editor.addEventListener('input', () => {
            if (isRemoteUpdate) return;

            let val = editor.value;
            const cursor = editor.selectionStart;
            let textBefore = val.substring(0, cursor);
            const textAfter = val.substring(cursor);
            let modified = false;

            // 1. Time format (12-hour AM/PM)
            if (textBefore.endsWith('-- ')) {
                const timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }) + ' ';
                textBefore = textBefore.slice(0, -3) + timeStr;
                modified = true;
            }

            // 2. Dashed bullets to real bullets
            if (textBefore.match(/(^|\n)-\s$/)) {
                textBefore = textBefore.slice(0, -2) + '• ';
                modified = true;
            }

            // 3. Real Checkboxes
            if (textBefore.match(/(^|\n)\[\s\]\s$/)) {
                textBefore = textBefore.slice(0, -4) + '☐ ';
                modified = true;
            }
            if (textBefore.match(/(^|\n)\[[xX]\]\s$/)) {
                textBefore = textBefore.slice(0, -4) + '☑ ';
                modified = true;
            }

            // 4. Auto-Math Solver (e.g. 100 + 50 =)
            const mathMatch = textBefore.match(/(\d+(?:\.\d+)?)\s*([+\-*/])\s*(\d+(?:\.\d+)?)\s*=\s*$/);
            if (mathMatch) {
                const num1 = parseFloat(mathMatch[1]);
                const op = mathMatch[2];
                const num2 = parseFloat(mathMatch[3]);
                let result = 0;
                if (op === '+') result = num1 + num2;
                else if (op === '-') result = num1 - num2;
                else if (op === '*') result = num1 * num2;
                else if (op === '/') result = num1 / num2;
                
                result = Math.round(result * 100) / 100; // Round to 2 decimals
                textBefore += result;
                modified = true;
            }

            // Apply modifications
            if (modified) {
                editor.value = textBefore + textAfter;
                editor.setSelectionRange(textBefore.length, textBefore.length);
                val = editor.value;
            }

            renderHighlighter();
            localStorage.setItem(localCacheKey, val);

            if (currentUser) {
                setStatus('Saving...', 'saving');
                if (saveTimeout) clearTimeout(saveTimeout);
                
                saveTimeout = setTimeout(async () => {
                    try {
                        const noteDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'notes', 'scratchpad');
                        await setDoc(noteDocRef, { content: val, updatedAt: Date.now() }, { merge: true });
                        setStatus('Saved to Cloud', 'saved');
                    } catch (error) {
                        setStatus('Save Failed', 'error');
                    }
                }, 1000);
            }
        });

        // --- Feature 4 (Part A): Auto-Bullet & Checklist Continuation ---
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cursorPosition = editor.selectionStart;
                const textBeforeCursor = editor.value.substring(0, cursorPosition);
                const lines = textBeforeCursor.split('\n');
                const currentLine = lines[lines.length - 1];

                // Check for bullets and real checkboxes
                const bulletMatch = currentLine.match(/^(\s*)•\s+(.*)$/);
                const numMatch = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
                const checkMatch = currentLine.match(/^(\s*)([☐☑])\s+(.*)$/);

                if (bulletMatch || numMatch || checkMatch) {
                    e.preventDefault();
                    let insertion = '';
                    
                    const isEmpty = (bulletMatch && bulletMatch[2].trim().length === 0) || 
                                    (numMatch && numMatch[3].trim().length === 0) ||
                                    (checkMatch && checkMatch[3].trim().length === 0);

                    if (isEmpty) {
                        const lineStartPos = cursorPosition - currentLine.length;
                        const textBeforeLine = editor.value.substring(0, lineStartPos);
                        const textAfterCursor = editor.value.substring(cursorPosition);
                        
                        editor.value = textBeforeLine + '\n' + textAfterCursor;
                        editor.setSelectionRange(lineStartPos + 1, lineStartPos + 1);
                        editor.dispatchEvent(new Event('input'));
                        return;
                    }

                    if (checkMatch) {
                        insertion = `\n${checkMatch[1]}☐ `; 
                    } else if (bulletMatch) {
                        insertion = `\n${bulletMatch[1]}• `;
                    } else if (numMatch) {
                        const nextNum = parseInt(numMatch[2], 10) + 1;
                        insertion = `\n${numMatch[1]}${nextNum}. `;
                    }

                    const textAfterCursor = editor.value.substring(cursorPosition);
                    editor.value = textBeforeCursor + insertion + textAfterCursor;

                    const newPos = cursorPosition + insertion.length;
                    editor.setSelectionRange(newPos, newPos);
                    editor.dispatchEvent(new Event('input'));
                }
            }
        });

        // --- Feature 4 (Part B): Interactive Checklist Toggle ---
        editor.addEventListener('click', (e) => {
            const cursor = editor.selectionStart;
            if (cursor !== editor.selectionEnd) return; 

            const text = editor.value;
            const lineStart = text.lastIndexOf('\n', cursor - 1) + 1;
            let lineEnd = text.indexOf('\n', cursor);
            if (lineEnd === -1) lineEnd = text.length;
            
            const line = text.substring(lineStart, lineEnd);
            const checkMatch = line.match(/^(\s*)([☐☑])/);
            
            if (checkMatch) {
                const relativeCursor = cursor - lineStart;
                if (relativeCursor <= checkMatch[0].length + 1) {
                    const isChecked = checkMatch[2] === '☑';
                    const newChar = isChecked ? '☐' : '☑';
                    const newLine = line.replace(/^(\s*)[☐☑]/, `$1${newChar}`);
                    
                    editor.value = text.substring(0, lineStart) + newLine + text.substring(lineEnd);
                    editor.setSelectionRange(cursor, cursor); 
                    editor.dispatchEvent(new Event('input')); 
                }
            }
        });

        // --- Feature 2: Swipe-to-Copy Action ---
        let touchStartX = 0;
        let touchStartY = 0;

        bottomBar.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        bottomBar.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const deltaX = touchEndX - touchStartX;
            const deltaY = Math.abs(touchEndY - touchStartY);

            // If swiped right consistently
            if (deltaX > 70 && deltaY < 40) {
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = editor.value;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                
                try {
                    document.execCommand('copy');
                    
                    // UI Feedback
                    const originalText = statusText.innerText;
                    statusText.classList.add('status-pulse');
                    setStatus('Copied to Clipboard!', 'saved');
                    
                    setTimeout(() => {
                        statusText.classList.remove('status-pulse');
                        if (currentUser) setStatus('Saved to Cloud', 'saved');
                        else setStatus('Local Cache', 'local');
                    }, 2000);
                } catch (err) {
                    console.error('Copy failed');
                }
                
                document.body.removeChild(tempTextArea);
            }
        }, { passive: true });

        // --- UI Handlers (Clear Modal) ---
        clearBtn.addEventListener('click', () => { clearModal.classList.remove('hidden'); });

        cancelBtn.addEventListener('click', () => {
            clearModal.classList.add('hidden');
            setTimeout(() => editor.focus(), 100);
        });

        confirmClearBtn.addEventListener('click', async () => {
            editor.value = '';
            renderHighlighter();
            localStorage.removeItem(localCacheKey);
            clearModal.classList.add('hidden');
            
            if (currentUser) {
                try {
                    const noteDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'notes', 'scratchpad');
                    await setDoc(noteDocRef, { content: '', updatedAt: Date.now() }, { merge: true });
                    setStatus('Cleared', 'saved');
                } catch (e) {
                    setStatus('Clear Failed', 'error');
                }
            } else {
                setStatus('Local Cache Cleared', 'local');
            }
            setTimeout(() => editor.focus(), 100);
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') editor.focus();
        });
    </script>
</body>
</html>
